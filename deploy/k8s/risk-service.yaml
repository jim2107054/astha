apiVersion: apps/v1
kind: Deployment
metadata:
  name: risk-service
  namespace: astha-prod
  labels:
    app: risk-service
spec:
  replicas: 4
  selector:
    matchLabels:
      app: risk-service
  template:
    metadata:
      labels:
        app: risk-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: risk-service
          image: ghcr.io/jim2107054/astha-risk-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: astha-global-config
            - secretRef:
                name: astha-secrets
          resources:
            requests:
              cpu: 500m
              memory: 1024Mi
            limits:
              cpu: 2000m
              memory: 2048Mi
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 25
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: risk-service
  namespace: astha-prod
spec:
  type: ClusterIP
  selector:
    app: risk-service
  ports:
    - name: http
      port: 8080
      targetPort: 8080
