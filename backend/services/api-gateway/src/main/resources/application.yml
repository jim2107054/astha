server:
  port: 8090

spring:
  application:
    name: api-gateway

management:
  endpoints:
    web:
      exposure:
        include: "health,info,metrics"
  endpoint:
    health:
      show-details: always

gateway:
  routes:
    ingest: ${INGEST_SERVICE_URL:http://localhost:8081}
    risk: ${RISK_SERVICE_URL:http://localhost:8080}
    graph: ${GRAPH_SERVICE_URL:http://localhost:8082}
    case: ${CASE_SERVICE_URL:http://localhost:8083}
    dispute: ${DISPUTE_SERVICE_URL:http://localhost:8084}
    identity: ${IDENTITY_SERVICE_URL:http://localhost:8085}
    simulator: ${SIMULATOR_SERVICE_URL:http://localhost:8086}
    notification: ${NOTIFICATION_SERVICE_URL:http://localhost:8087}
    analytics: ${ANALYTICS_SERVICE_URL:http://localhost:8088}
    provider: ${PROVIDER_MOCK_URL:http://localhost:8089}
